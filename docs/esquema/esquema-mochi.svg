<text x="60" y="1190" fill="#d97757" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2">03</text>
<text x="60" y="1216" fill="#f4f1ea" font-size="21" font-weight="600">Tres coisas que queimam ou enganam</text>
<text x="60" y="1238" fill="#8b857c" font-size="14"></text>
<circle cx="68" cy="1229" r="3.5" fill="#d97757"/>
<text x="86" y="1234" fill="#f4f1ea" font-size="14.5" font-weight="600">VCC so em 3V3</text>
<text x="86" y="1255" fill="#8b857c" font-size="13.5">5 V ou VIN queima o display. Os dois lados sao 3,3 V.</text>
<circle cx="68" cy="1283" r="3.5" fill="#d97757"/>
<text x="86" y="1288" fill="#f4f1ea" font-size="14.5" font-weight="600">A ordem dos pinos varia</text>
<text x="86" y="1309" fill="#8b857c" font-size="13.5">Cada modulo ST7789 imprime os pinos numa ordem. Va pelo NOME na serigrafia, nunca pela posicao</text>
<text x="86" y="1328" fill="#8b857c" font-size="13.5">deste desenho.</text>
<circle cx="68" cy="1356" r="3.5" fill="#d97757"/>
<text x="86" y="1361" fill="#f4f1ea" font-size="14.5" font-weight="600">Sem CS no seu modulo?</text>
<text x="86" y="1382" fill="#8b857c" font-size="13.5">Deixe o fio roxo de fora e troque no .ino: #define TFT_CS -1</text>
<circle cx="68" cy="1410" r="3.5" fill="#d97757"/>
<text x="86" y="1415" fill="#f4f1ea" font-size="14.5" font-weight="600">Fio curto</text>
<text x="86" y="1436" fill="#8b857c" font-size="13.5">O SPI roda a 40 MHz. Jumper longo vira listra na tela — se acontecer, baixe setSPISpeed para</text>
<text x="86" y="1455" fill="#8b857c" font-size="13.5">20000000.</text>
<text x="60" y="1530" fill="#5c564e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">gerado por docs/esquema/gera_svg.py — nao edite o SVG a mao</text>
